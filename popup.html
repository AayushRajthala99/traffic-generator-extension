<!DOCTYPE html>
<html>
  <head>
    <title>Request Sender</title>
    <style>
      body {
        width: 300px;
        font-family: sans-serif;
        padding: 10px;
      }
      textarea {
        width: 95%;
        height: 100px;
        margin-bottom: 10px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="number"] {
        width: 60px;
        margin-bottom: 10px;
      }
      button {
        margin-right: 5px;
        padding: 5px 10px;
      }
      #status {
        margin-top: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h3>Traffic Generator Extension</h3>

    <label for="urls">URLs (one per line):</label>
    <textarea id="urls"></textarea>

    <label for="interval">Interval (seconds):</label>
    <input type="number" id="interval" min="1" value="60" />

    <button id="startButton">Start</button>
    <button id="stopButton">Stop</button>

    <div id="status">Status: Stopped</div>

    <script src="popup.js"></script>
  </body>
</html>
